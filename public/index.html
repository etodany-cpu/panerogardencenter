/* ===== Icone colorate ===== */
:root{--c1a:#7ed957;--c1b:#2e9e4f;--c2a:#7cc8ff;--c2b:#2b7fd8;--c3a:#ffd36b;--c3b:#f39a12;--c4a:#ffa58a;--c4b:#e8573a;--c5a:#c6a6ff;--c5b:#7a4fd6;--c6a:#77e0d0;--c6b:#14998a}
.grid>.card:nth-child(6n+1){--ia:var(--c1a);--ib:var(--c1b)}
.grid>.card:nth-child(6n+2){--ia:var(--c2a);--ib:var(--c2b)}
.grid>.card:nth-child(6n+3){--ia:var(--c3a);--ib:var(--c3b)}
.grid>.card:nth-child(6n+4){--ia:var(--c4a);--ib:var(--c4b)}
.grid>.card:nth-child(6n+5){--ia:var(--c5a);--ib:var(--c5b)}
.grid>.card:nth-child(6n+6){--ia:var(--c6a);--ib:var(--c6b)}
.ico{width:56px;height:56px;border-radius:18px;font-size:1.75rem;background:linear-gradient(140deg,var(--ia,var(--c1a)),var(--ib,var(--c1b)));box-shadow:0 10px 20px -10px var(--ib,var(--c1b)),inset 0 1px 0 rgba(255,255,255,.45);text-shadow:0 2px 4px rgba(0,0,0,.18)}
.step::before{background:linear-gradient(140deg,var(--ia,var(--c1a)),var(--ib,var(--c1b)));box-shadow:0 8px 16px -8px var(--ib,var(--c1b));text-shadow:0 1px 2px rgba(0,0,0,.25)}
.steps .card::after{background:linear-gradient(90deg,var(--ia),var(--ib))}
.pimg:not(.ph){background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--ia) 45%,var(--card)),color-mix(in srgb,var(--ib) 22%,var(--card)) 78%);font-size:3rem}
.badges .ck{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:7px;border-radius:50%;font-style:normal;font-size:.72rem;color:#123018;background:linear-gradient(140deg,#d4f58a,#7ed957)}
.badges span:nth-child(3n+2) .ck{background:linear-gradient(140deg,#c9ecff,#7cc8ff)}
.badges span:nth-child(3n+3) .ck{background:linear-gradient(140deg,#ffe9a8,#ffc94d)}
.wday .wi{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(140deg,#e6f4ff,#bfe3ff)}
.wday:nth-child(odd) .wi{background:linear-gradient(140deg,#fff3cf,#ffe08a)}
.mcats li:nth-child(4n+1){background:rgba(126,217,87,.22);border-color:rgba(126,217,87,.45)}
.mcats li:nth-child(4n+2){background:rgba(124,200,255,.2);border-color:rgba(124,200,255,.45)}
.mcats li:nth-child(4n+3){background:rgba(255,211,107,.2);border-color:rgba(255,211,107,.45)}
.mcats li:nth-child(4n+4){background:rgba(198,166,255,.2);border-color:rgba(198,166,255,.45)}
.info b::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:linear-gradient(140deg,var(--c1a),var(--c1b))}
.info p:nth-child(2) b::before{background:linear-gradient(140deg,var(--c2a),var(--c2b))}
.info p:nth-child(3) b::before{background:linear-gradient(140deg,var(--c4a),var(--c4b))}
.info p:nth-child(4) b::before{background:linear-gradient(140deg,var(--c3a),var(--c3b))}

/* ===== Miniature dei marchi ===== */
.mlist button{display:flex;align-items:center;gap:14px}
.mth{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;opacity:.7;transition:opacity .2s,transform .2s}
.mth img{width:100%;height:100%;object-fit:contain;padding:4px}
.mth.noimg{font-size:1.4rem;color:#fff;background:linear-gradient(140deg,var(--c3a),var(--c3b));border:0}
.mlist button:nth-child(4n+2) .mth.noimg{background:linear-gradient(140deg,var(--c2a),var(--c2b))}
.mlist button:nth-child(4n+3) .mth.noimg{background:linear-gradient(140deg,var(--c5a),var(--c5b))}
.mlist button:nth-child(4n+4) .mth.noimg{background:linear-gradient(140deg,var(--c4a),var(--c4b))}
.mlist button[aria-selected="true"] .mth,.mlist button:hover .mth{opacity:1}
.mlist button[aria-selected="true"] .mth{transform:scale(1.06)}
.mhead{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.mhead h3{margin:0}
.mpic{width:76px;height:76px;flex:none;border-radius:20px;background:#fff;object-fit:contain;padding:6px;box-shadow:0 10px 24px -12px rgba(0,0,0,.6)}
@media(max-width:779px){.mlist button{flex-direction:column;gap:6px;font-size:1.05rem;padding:6px 4px 12px}.mth{width:56px;height:56px}.mpic{width:60px;height:60px}}
@media (prefers-reduced-motion:reduce){.mth{transition:none}}

/* ===== Mappa compatta con sfondo cartografico ===== */
.map{position:relative;max-width:380px;height:170px;margin-top:14px;border-radius:22px;overflow:hidden;background:var(--soft);border:1px solid var(--border);box-shadow:var(--shadow)}
.map .mfb{position:absolute;inset:0;width:100%;height:100%}
.mtiles{position:absolute;inset:0;overflow:hidden}
.mtiles img{position:absolute;width:256px;height:256px;max-width:none;user-select:none}
.map.live .mtiles{filter:saturate(.85) contrast(.95)}
.mpin{position:absolute;left:50%;top:42%;width:30px;height:40px;transform:translate(-50%,-100%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.map .mact{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;flex-wrap:wrap;padding:24px 12px 12px;background:linear-gradient(to top,rgba(10,30,18,.55),rgba(10,30,18,0))}
.map .mact .btn{padding:7px 14px;font-size:.85rem}
.map .mact .btn.o{background:rgba(255,255,255,.92);color:#14231a;border-color:transparent}
.mosm{position:absolute;right:6px;top:6px;font-size:.65rem;line-height:1;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.85);color:#333;text-decoration:none}

/* ===== Logo aziendale ===== */
.logo{display:inline-flex;align-items:center;gap:12px;min-width:0}
.logo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logoimg{display:block;height:48px;width:auto;border-radius:10px;box-shadow:0 2px 8px -2px rgba(0,0,0,.35);flex:none}
header .wrap{height:68px}
@media(max-width:480px){.logoimg{height:40px}.logo{gap:9px;font-size:1rem}}

/* ===== Logo trasparente: inchiostro scuro su tema chiaro, bianco su tema scuro ===== */
.logoimg{height:50px;border-radius:0;box-shadow:none}
.logoimg.lg-dk{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logoimg.lg-dk{display:block}:root:not([data-theme="light"]) .logoimg.lg-lt{display:none}}
:root[data-theme="dark"] .logoimg.lg-dk{display:block}
:root[data-theme="dark"] .logoimg.lg-lt{display:none}
@media(max-width:480px){.logoimg{height:42px}}

<div class="card"><label for="n">Nome</label><input id="n" autocomplete="name"><label for="t">Telefono o email</label><input id="t"><label for="r">Di cosa hai bisogno?</label>
