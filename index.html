<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Panero Francesco S.N.C – Vendita e riparazione robot rasaerba</title><style id="css">:root{--base:#2e7d32;--bg:#f6f8f3;--fg:#17261c;--muted:#52635a;--card:#fff;--accent:var(--base);--accent-fg:#fff;--soft:color-mix(in srgb,var(--base) 14%,var(--bg));--border:#d5e0cd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1812;--fg:#e8f1e9;--muted:#a3b5a8;--card:#17241c;--accent:color-mix(in srgb,var(--base) 55%,#fff);--accent-fg:#0f1812;--border:#27392d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1812;--fg:#e8f1e9;--muted:#a3b5a8;--card:#17241c;--accent:color-mix(in srgb,var(--base) 55%,#fff);--accent-fg:#0f1812;--border:#27392d;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img,svg{max-width:100%}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-weight:800;font-size:1.2rem;color:var(--accent);text-decoration:none}
nav a{color:var(--fg);text-decoration:none;margin-left:18px;font-size:.95rem}
nav a:hover{color:var(--accent)}
@media(max-width:640px){nav a.h{display:none}}
.btn{display:inline-block;background:var(--accent);color:var(--accent-fg);padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;border:0;font-size:1rem;cursor:pointer}
.btn.o{background:transparent;color:var(--fg);border:2px solid var(--border)}
.hero{padding:48px 0 40px}
.hero .wrap{display:grid;gap:32px;align-items:center}
@media(min-width:800px){.hero .wrap{grid-template-columns:1.1fr .9fr}}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;margin:0 0 14px}
h1 span{color:var(--accent)}
.lead{color:var(--muted);font-size:1.1rem;margin:0 0 24px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.badges{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;color:var(--muted);font-size:.9rem}
section{padding:48px 0}
section.alt{background:var(--soft)}
h2{font-size:1.8rem;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 28px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
.card h3{margin:8px 0 6px;font-size:1.1rem}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.ico{font-size:1.8rem}
.step{counter-increment:s}
.step::before{content:counter(s);display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:800}
.steps{counter-reset:s}
.contact{display:grid;gap:28px}
@media(min-width:800px){.contact{grid-template-columns:1fr 1fr}}
label{display:block;font-size:.9rem;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
textarea{min-height:100px;resize:vertical}
.info p{margin:0 0 12px}
.info b{display:block;color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.chip{background:var(--card);color:var(--fg);border:1px solid var(--border);padding:8px 16px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pimg{height:170px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:2.6rem;margin-bottom:10px}
.price{font-weight:800;font-size:1.2rem;color:var(--accent);margin:10px 0}
.card .btn{padding:9px 18px;font-size:.9rem}
.stars{color:#f9a825;letter-spacing:2px}
.card p.who{margin-top:12px;font-weight:600;color:var(--fg)}
.map{margin-top:8px;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--card)}
.map svg{display:block;width:100%;height:auto}
.map div{padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap}
.map .btn{padding:9px 18px;font-size:.9rem}
.heroimg{background:#fff;border:1px solid var(--border);border-radius:24px;padding:16px;text-align:center}
.heroimg img{display:block;width:100%;height:auto}
.heroimg span{display:block;color:#52635a;font-size:.85rem;font-weight:600;margin-top:4px}
.pimg.ph{background:#fff}
.pimg img{width:100%;height:100%;object-fit:contain}
footer{padding:26px 0;border-top:1px solid var(--border);color:var(--muted);font-size:.88rem;text-align:center}

.rate{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 22px;margin:0 0 8px}
.rate .big{font-size:2rem}.rate b{display:block;font-size:1.3rem}.rate span{color:var(--muted);font-size:.95rem}
.note{color:var(--muted);font-size:.85rem;margin:0 0 20px}
.adm-btn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.adm{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5)}.adm.on{display:block}
.adm-box{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
.adm fieldset{border:1px solid var(--border);border-radius:12px;margin:14px 0;padding:6px 14px 14px}
.adm legend{font-weight:800;color:var(--accent);padding:0 6px}
.adm input[type=color]{height:44px;padding:2px}
.adm fieldset .btn{margin-top:12px}
.adm-bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border)}
</style></head><body><div id="root"></div><template id="tpl"><header><div class="wrap"><a class="logo" href="#top">🌱 {{ditta}}</a><nav><a class="h" href="#servizi">Servizi</a><a class="h" href="#riparazioni">Riparazioni</a><a class="h" href="#perche">Perché noi</a><a class="h" href="#catalogo">Catalogo</a><a class="h" href="#recensioni">Recensioni</a><a href="#contatti">Contatti</a></nav></div></header>
<main id="top">
<div class="hero"><div class="wrap"><div><h1>{{titolo1}} <span>{{titolo2}}</span>.</h1><p class="lead">{{intro}}</p>
<div class="cta"><a class="btn" href="#contatti">Richiedi un preventivo</a><a class="btn o" href="#servizi">Scopri i servizi</a></div><div class="badges" id="vant"></div></div>
<div class="heroimg"><img id="hero" src="{{foto}}" alt="{{fotoDidascalia}}"><span>{{fotoDidascalia}}</span></div></div></div>

<section id="riparazioni"><div class="wrap"><h2>{{tRip}}</h2><p class="sub">{{sRip}}</p><div class="grid steps" id="g-passi"></div></div></section>
<section id="perche" class="alt"><div class="wrap"><h2>{{tPerche}}</h2><p class="sub">{{sPerche}}</p><div class="grid" id="g-perche"></div></div></section>
<section id="catalogo"><div class="wrap"><h2>{{tCatalogo}}</h2><p class="sub">{{sCatalogo}}</p>
<div class="chips" id="chips"><button class="chip on" data-f="all" type="button">Tutti</button><button class="chip" data-f="s" type="button">{{fs}}</button><button class="chip" data-f="m" type="button">{{fm}}</button><button class="chip" data-f="l" type="button">{{fl}}</button></div>
<div class="grid" id="prodotti"></div></div></section>
<section id="recensioni" class="alt"><div class="wrap"><h2>{{tRec}}</h2><p class="sub">{{sRec}}</p><div class="rate" id="rate"><div class="stars big">★★★★★</div><div><b>{{gRating}} su 5</b><span>{{gCount}} recensioni su Google</span></div></div><p class="note">{{gNota}}</p><div class="grid" id="g-rec"></div><p style="margin:22px 0 0;display:flex;gap:10px;flex-wrap:wrap"><a class="btn" id="gr" target="_blank" rel="noopener">Leggi le recensioni su Google</a><a class="btn o" id="gw" target="_blank" rel="noopener">Lascia una recensione</a></p></div></section>

<p style="margin:16px 0 0;display:flex;gap:10px;flex-wrap:wrap"><a class="btn" id="wa" target="_blank" rel="noopener">Scrivi su WhatsApp</a><a class="btn o" id="tel">Chiama ora</a><a class="btn o" id="frm" target="_blank" rel="noopener">Compila il modulo online</a></p><p id="fm" style="margin:10px 0 0;color:var(--muted);font-size:.9rem"></p></div></div></section>
